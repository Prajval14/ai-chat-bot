name: chatbot-app
metadata:
  template: chatbot-app@1.0.0
workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy --all
services:
  api:
    project: ./src/api
    language: py
    host: appservice
    env:     
      SCM_DO_BUILD_DURING_DEPLOYMENT: true
      BOT_NAME: ""
      BOT_ICON: ""
      BOT_COLOR: ""
      OPENAI_API_KEY: {{OPENAI_API_KEY}}
      NEO4J_URI: {{NEO4J_URI}}
      NEO4J_USERNAME: {{NEO4J_USERNAME}}
      NEO4J_PASSWORD: {{NEO4J_PASSWORD}}
      AZURE_STORAGE_CONNECTION_STRING: ${{ outputs.storageConnectionString }}
      AZURE_BLOB_CONTAINER: ${{ outputs.storageBlobContainer }}
      AZURE_SEARCH_ENDPOINT: ${{ outputs.searchEndpoint }}
      AZURE_SEARCH_KEY: ${{ outputs.searchKey }}  
  web:
    project: ./src/web
    language: js
    host: staticwebapp
    env:
      VITE_API_URL: ${{ outputs.apiAppUrl }}
infra:
  path: ./infra